<!-- Step 3: OTP -->
<div class="login-step" id="step3">
    <div class="step-title">Verify Security Code</div>
    <div class="step-subtitle">We've sent a 6-digit verification code to your registered email address</div>
    
    <div class="otp-inputs" id="otpInputs">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 1">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 2">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 3">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 4">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 5">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 6">
    </div>
    
    <!-- Dev OTP Display (Only shown in dev mode) -->
    <div class="dev-otp" id="devOtpDisplay" style="display: none;">
        <span>[Dev Only] Verification Code:</span>
        <strong id="devOtpValue">123456</strong>
    </div>
    
    <div class="text-center mb-5">
        <button type="button" id="btnResendOtp" class="auth-resend-link" disabled>
            Resend in <span id="resendTimer">60</span>s
        </button>
    </div>
    
    <button class="btn-auth-primary" id="btnVerifyOtp">
        <span class="btn-text">Verify Code</span>
        <div class="spinner" style="display: none;"></div>
        <i class="fa-solid fa-shield-check"></i>
    </button>
    
    <button class="btn-auth-secondary mt-2.5" id="btnStep3Back">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
</div>
