<!-- Step 2: Password -->
<div class="login-step" id="step2">
    <div class="step-title">Welcome Back</div>
    <div class="step-subtitle">Enter your password to securely access your account</div>
    
    <div class="auth-user-card" id="userDisplay">
        <i class="fa-solid fa-circle-user user-avatar-icon"></i>
        <div class="flex-1 min-w-0">
            <div class="user-name truncate" id="displayUserName">User Name</div>
            <div class="user-email truncate" id="displayUserEmail">user@email.com</div>
        </div>
    </div>
    
    <div class="auth-input-group mb-1">
        <label class="auth-input-label" for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password" required>
        <i class="fa-solid fa-lock input-icon"></i>
        <button type="button" class="pass-toggle" id="togglePassword" aria-label="Toggle password visibility">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>
    
    <button type="button" class="auth-forgot-link" id="btnForgotPassword">Forgot password?</button>
    
    <button class="btn-auth-primary" id="btnLogin">
        <span class="btn-text">Sign In</span>
        <div class="spinner" style="display: none;"></div>
        <i class="fa-solid fa-right-to-bracket"></i>
    </button>
    
    <button class="btn-auth-secondary mt-2.5" id="btnStep2Back">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
</div>
