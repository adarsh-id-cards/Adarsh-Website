<!-- Step 1: Email, Username, or Phone -->
<div class="login-step active" id="step1">
    <div class="step-title">Identity Verification</div>
    <div class="step-subtitle" id="step2Subtitle">Enter your registered email, username, or phone number to get started</div>
    
    <div class="auth-input-group">
        <label class="auth-input-label" for="emailInput">Email, Username, or Phone</label>
        <input type="text" id="emailInput" placeholder="Enter your credential" autocomplete="username" required>
        <i class="fa-solid fa-user input-icon"></i>
    </div>
    
    <button class="btn-auth-primary mt-2" id="btnStep1Next">
        <span class="btn-text">Continue</span>
        <div class="spinner" style="display: none;"></div>
        <i class="fa-solid fa-arrow-right"></i>
    </button>
</div>
