<!-- Step 4: Reset Password -->
<div class="login-step" id="step4">
    <div class="step-title">Create New Password</div>
    <div class="step-subtitle">Choose a strong password to keep your account secure</div>
    
    <div class="auth-input-group">
        <label class="auth-input-label" for="newPasswordInput">New Password</label>
        <input type="password" id="newPasswordInput" placeholder="Enter new password" required>
        <i class="fa-solid fa-lock input-icon"></i>
        <button type="button" class="pass-toggle" id="toggleNewPassword" aria-label="Toggle password visibility">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>
    
    <div class="auth-input-group mb-5">
        <label class="auth-input-label" for="confirmPasswordInput">Confirm Password</label>
        <input type="password" id="confirmPasswordInput" placeholder="Confirm new password" required>
        <i class="fa-solid fa-lock input-icon"></i>
    </div>
    
    <button class="btn-auth-primary" id="btnResetPassword">
        <span class="btn-text">Reset Password</span>
        <div class="spinner" style="display: none;"></div>
        <i class="fa-solid fa-key"></i>
    </button>
</div>
